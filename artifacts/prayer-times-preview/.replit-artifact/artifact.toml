kind = "web"
previewPath = "/"
title = "مواقيت الصلاة"
description = "معاينة نسخة الويب من تطبيق مواقيت الصلاة Flutter الموجود في mobile/prayer_times، بنفس واجهته وبياناته دون إعادة كتابة التطبيق."
version = "1.0.0"
id = "artifacts/prayer-times-preview"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18355

[services.development]
run = "pnpm --filter @workspace/prayer-times-preview run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prayer-times-preview", "run", "build" ]
serve = "static"
publicDir = "artifacts/prayer-times-preview/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18355"
BASE_PATH = "/"
